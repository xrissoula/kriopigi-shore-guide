name: Update Kriopigi conditions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install copernicusmarine xarray netCDF4 pandas

      - name: Configure Copernicus credentials
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: |
          copernicusmarine login \
            --username "$COPERNICUSMARINE_SERVICE_USERNAME" \
            --password "$COPERNICUSMARINE_SERVICE_PASSWORD"

      - name: Update conditions
        run: |
          python data-pipeline/kriopigi_conditions.py

      - name: Commit updated conditions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/kriopigi_conditions.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Kriopigi conditions"
            git push
          fi
